# BrainDump: builds the all-in-one image on every push to the braindump branch,
# so the office PC only pulls it (no local build, no disk spent on it).
name: BrainDump image

on:
  push:
    branches: ["braindump"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: aio
          platforms: linux/amd64
          push: true
          build-args: SERVER_VERSION=braindump-${{ github.sha }}
          tags: ghcr.io/misterperry69/braindump:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
